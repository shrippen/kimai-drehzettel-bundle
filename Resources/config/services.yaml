services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Domain and Enum are plain value objects, not services.
    KimaiPlugin\DrehzettelBundle\:
        resource: '../../*'
        exclude:
            - '../../Domain/'
            - '../../Enum/'
            - '../../Migrations/'
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../tests/'
            - '../../dev/'
            - '../../reference/'

    KimaiPlugin\DrehzettelBundle\Service\Labels: '@KimaiPlugin\DrehzettelBundle\Service\TranslatorLabels'

    KimaiPlugin\DrehzettelBundle\Controller\:
        resource: '../../Controller'
        tags: ['controller.service_arguments']
        public: true

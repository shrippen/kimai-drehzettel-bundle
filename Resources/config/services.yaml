services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Domain and Enum are plain value objects, not services.
    KimaiPlugin\DrehzettelBundle\:
        resource: '../../*'
        exclude:
            - '../../Domain/'
            - '../../Enum/'
            - '../../Migrations/'
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../tests/'
            - '../../dev/'
            - '../../reference/'

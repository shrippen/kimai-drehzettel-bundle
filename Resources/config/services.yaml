services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Domain and Enum are plain value objects, not services.
    # Service/Holiday/ is excluded because it type-hints classes from the optional
    # KimaiPlugin\HolidayBundle plugin: DrehzettelExtension registers it by hand,
    # only when that plugin is installed, so the container still compiles without it.
    KimaiPlugin\DrehzettelBundle\:
        resource: '../../*'
        exclude:
            - '../../Domain/'
            - '../../Enum/'
            - '../../Migrations/'
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../tests/'
            - '../../dev/'
            - '../../reference/'
            - '../../Service/Holiday/'

    KimaiPlugin\DrehzettelBundle\Service\Labels: '@KimaiPlugin\DrehzettelBundle\Service\TranslatorLabels'
    KimaiPlugin\DrehzettelBundle\Service\HolidayLookupInterface: '@KimaiPlugin\DrehzettelBundle\Service\NullHolidayLookup'

    KimaiPlugin\DrehzettelBundle\Controller\:
        resource: '../../Controller'
        tags: ['controller.service_arguments']
        public: true
